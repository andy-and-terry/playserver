networks:
  dgx-net:
    driver: bridge

services:
  # ── Node.js / Express server ──────────────────────────────────────────────
  dgx-server-node:
    build:
      context: .
      dockerfile: server-node/Dockerfile
    image: dgx-server-tools-node:latest
    container_name: dgx-server-node
    restart: unless-stopped
    env_file: .env
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    volumes:
      - ./data:/app/data
    networks:
      - dgx-net


  # ── Ollama (optional — enable with: docker compose --profile ollama up) ──
  #
  # Requires NVIDIA Container Toolkit:
  #   https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/
  #
  # If no GPU is available, remove or comment out the entire `deploy` block.
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - dgx-net
    # GPU passthrough — comment out if no NVIDIA GPU is present
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  ollama-data:
